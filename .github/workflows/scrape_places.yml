name: Scrape Google Places weekly

# Runs Sunday at 13:00 UTC (~6am SF). Places change less than events, and the
# Places API costs ~$13 per full grid scan, so weekly is the right cadence.
# Also triggerable manually from the Actions tab via "Run workflow".
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 0"

jobs:
  scrape-places:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scraper deps
        working-directory: "Data_scraping "
        run: pip install -r requirements.txt

      # Auths against GCP using the same service-account JSON as scrape_events.yml.
      # Required GitHub Secrets (Settings → Secrets and variables → Actions):
      #   GCP_SA_KEY:             contents of a service-account JSON with
      #                           roles/bigquery.dataEditor + roles/bigquery.jobUser
      #                           on mlops-project-491402
      #   GOOGLE_PLACES_API_KEY:  Places API (New) key
      #   GCP_PROJECT:            mlops-project-491402
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run scraper
        working-directory: "Data_scraping "
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET: places_raw
          BQ_TABLE: venues
        run: python places_to_bq.py
