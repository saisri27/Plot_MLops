<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Plot — Group Hangout Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #fbf6ee;          /* warm cream */
    --panel: #ffffff;       /* card */
    --ink: #2b2118;         /* deep brown text */
    --muted: #8a7a6b;       /* warm grey */
    --line: #ece2d2;        /* hairline */
    --accent: #d96b3c;      /* terracotta orange */
    --accent-2: #f5b347;    /* peachy yellow */
    --sage: #9ec7a8;        /* sage green */
    --lilac: #c8c1ef;       /* soft purple */
    --coral: #ff7a59;       /* bright coral */
    --shadow: 0 6px 18px rgba(43, 33, 24, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px; background:
      radial-gradient(900px 500px at 90% -10%, rgba(255,122,89,0.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(200,193,239,0.18), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }

  /* Header band */
  .hero {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 18px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .pin {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 4px, var(--accent) 5px 100%);
    box-shadow: 0 2px 0 rgba(0,0,0,0.05);
  }
  .brand h1 { font-size: 1.4rem; margin: 0; letter-spacing: -.5px; }
  .brand small { color: var(--muted); }
  .badges { display: flex; gap: 8px; }
  .badge {
    background: #fff; border: 1px solid var(--line); color: var(--ink);
    padding: 6px 12px; border-radius: 999px; font-size: .8rem;
  }
  .badge.sf { background: #fff7ee; border-color: #f1d8b5; color: #a64d22; }
  .badge.fun { background: #f4f0ff; border-color: #ddd5ff; color: #5b4bb1; }

  .subtitle { color: var(--muted); margin: 0 4px 18px; }

  /* Controls row */
  .row { display: flex; gap: 12px; align-items: end; margin: 14px 0 22px; flex-wrap: wrap; }
  .row label { margin: 0; color: var(--muted); font-size: .8rem; }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel); border-radius: 18px; padding: 18px 20px;
    border: 1px solid var(--line); box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; right: -30px; top: -30px;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--accent-2), transparent 70%);
    opacity: .55;
  }
  .card h3 { margin: 0 0 10px; color: var(--ink); font-size: 1rem; font-weight: 700; }
  .card h3 small { color: var(--muted); font-weight: 500; }

  label { display: block; font-size: .82rem; color: var(--muted); margin: 10px 0 4px; }
  select, input[type=number], input[type=text] {
    width: 100%; padding: 9px 11px; border-radius: 12px; background: #fff;
    color: var(--ink); border: 1px solid var(--line); font-size: .9rem;
  }
  select:focus, input:focus { outline: 2px solid rgba(217,107,60,0.25); border-color: var(--accent); }

  input[type=range] { width: 100%; accent-color: var(--accent); }

  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: #fff; padding: 6px 11px;
    border-radius: 999px; font-size: .78rem; color: var(--ink);
    cursor: pointer; user-select: none; transition: all .15s ease;
  }
  .chip:hover { transform: translateY(-1px); box-shadow: 0 2px 0 rgba(0,0,0,0.05); }
  .chip.on {
    background: var(--sage); border-color: #7cae89; color: #1d3a26; font-weight: 600;
  }

  /* Per-card vibe accents — cycle through 4 colors so any group size looks good */
  #users .card:nth-child(4n+1)::before { background: radial-gradient(circle at 30% 30%, var(--accent-2), transparent 70%); }
  #users .card:nth-child(4n+2)::before { background: radial-gradient(circle at 30% 30%, var(--lilac), transparent 70%); }
  #users .card:nth-child(4n+3)::before { background: radial-gradient(circle at 30% 30%, var(--sage), transparent 70%); }
  #users .card:nth-child(4n+4)::before { background: radial-gradient(circle at 30% 30%, var(--coral), transparent 70%); }

  /* Card name + remove button row */
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; position: relative; z-index: 1; }
  .name-input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; color: var(--ink);
    font-size: 1.05rem; font-weight: 700; padding: 4px 6px;
    border-radius: 8px;
  }
  .name-input:focus { outline: 2px solid rgba(217,107,60,0.25); background: #fff; }
  .name-input::placeholder { color: var(--muted); font-weight: 500; }
  .user-id-tag { color: var(--muted); font-size: .75rem; font-weight: 500; }
  .remove-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    width: 26px; height: 26px; border-radius: 50%; padding: 0;
    cursor: pointer; line-height: 1; font-size: 1rem;
    box-shadow: none; transition: background .15s ease, color .15s ease;
  }
  .remove-btn:hover:not(:disabled) { background: #ffe7e0; color: #a64d22; border-color: #f4b8a8; }
  .remove-btn:disabled { opacity: .35; cursor: not-allowed; }

  /* Add-friend card */
  .add-card {
    display: flex; align-items: center; justify-content: center;
    min-height: 220px; cursor: pointer;
    background: transparent;
    border: 2px dashed #d8c8b3;
    border-radius: 18px; color: var(--muted);
    font-weight: 600; font-size: .95rem;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .add-card:hover { background: #fff7ee; border-color: var(--accent); color: var(--accent); }
  .add-card span { font-size: 1.4rem; margin-right: 6px; line-height: 1; }

  /* Button */
  button {
    background: var(--accent); color: #fff; border: 0; padding: 11px 20px;
    border-radius: 999px; font-weight: 700; cursor: pointer; font-size: .95rem;
    box-shadow: 0 4px 0 rgba(133, 60, 25, 0.15);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(1px); box-shadow: 0 2px 0 rgba(133, 60, 25, 0.15); }
  button:disabled { opacity: .6; cursor: not-allowed; }

  .meta { color: var(--muted); font-size: .85rem; margin: 8px 0 16px; }

  /* Results */
  .venues { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 12px; }
  .venue {
    background: var(--panel); border-radius: 16px; padding: 14px 16px;
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .venue h4 { margin: 0 0 6px; color: var(--ink); font-size: 1rem; }
  .pill {
    display: inline-block; background: #fff7ee; color: #a64d22;
    border: 1px solid #f1d8b5; padding: 2px 8px; border-radius: 999px;
    font-size: .72rem; margin-right: 6px;
  }
  .pill:nth-of-type(2) { background: #f4f0ff; color: #5b4bb1; border-color: #ddd5ff; }
  .pill:nth-of-type(3) { background: #fff4d6; color: #946417; border-color: #f3dfa1; }
  .pill:nth-of-type(4) { background: #eaf4ec; color: #2f6b3c; border-color: #cde6d2; }
  .score { color: var(--accent); font-weight: 700; }
  .reason { color: var(--muted); font-size: .85rem; margin-top: 6px; font-style: italic; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .error { color: #8a2b1d; background: #ffe7e0; padding: 10px 12px; border-radius: 12px; margin-top: 12px; border: 1px solid #f7c2b3; }

  /* Feedback buttons (Yay / Nahh) */
  .feedback { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .fb-btn {
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font-weight: 600; font-size: .82rem;
    cursor: pointer; transition: transform .08s ease, background .15s ease;
  }
  .fb-btn:hover { transform: translateY(-1px); }
  .fb-btn.yay  { background: #eaf4ec; border-color: #b8d6bf; color: #2f6b3c; }
  .fb-btn.nahh { background: #ffe7e0; border-color: #f4b8a8; color: #a64d22; }
  .fb-btn.sent { opacity: .55; cursor: default; transform: none; }
  .fb-status { font-size: .75rem; color: var(--muted); margin-left: 4px; }
  .rec-id { font-size: .72rem; color: var(--muted); margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Ranking-mode banner shown above results: which engine ranked them */
  .rank-mode {
    display: inline-block; padding: 6px 14px; border-radius: 999px;
    font-size: .82rem; font-weight: 600; margin: 14px 0 6px;
    border: 1px solid var(--line);
  }
  .rank-mode.llm  { background: #f4f0ff; color: #5b4bb1; border-color: #ddd5ff; }
  .rank-mode.v0   { background: #fff7ee; color: #a64d22; border-color: #f1d8b5; }
</style>
</head>
<body>

<header class="hero">
  <div class="brand">
    <span class="pin" aria-hidden="true"></span>
    <div>
      <h1>Plot</h1>
      <small>Group hangout planner — fun stuff to do with friends</small>
    </div>
  </div>
  <div class="badges">
    <span class="badge sf">🌉 Made for SF</span>
    <span class="badge fun">✨ Demo</span>
  </div>
</header>

<div class="subtitle">3 friends, 3 vibes. Set budget, distance, and what you're feeling — Plot picks venues that work for everyone.</div>

<div class="row">
  <div>
    <label>API URL</label>
    <input id="apiUrl" type="text" value="http://127.0.0.1:8080/recommend" style="width: 360px;" />
  </div>
  <div>
    <label>Top K</label>
    <input id="topK" type="number" min="1" max="20" value="5" style="width: 100px;" />
  </div>
  <button id="go">Find our spot ✨</button>
</div>

<div class="grid" id="users"></div>

<div id="status" class="meta"></div>
<div id="output"></div>

<script>
const CATEGORIES = [
  "Food & Drink","Outdoors","Entertainment","Arts & Culture",
  "Nightlife","Sports & Recreation","Wellness & Beauty",
  "Shopping","Classes & Workshops","Pets & Animals",
  "Music & Live Shows"
];
const USERS = [
  { id: "user_1", name: "Sai",    budget: "medium", distance: 5, cats: new Set(["Food & Drink"]) },
  { id: "user_2", name: "PJ",     budget: "low",    distance: 3, cats: new Set(["Outdoors"]) },
  { id: "user_3", name: "Arushi", budget: "high",   distance: 8, cats: new Set(["Food & Drink","Entertainment"]) },
  { id: "user_4", name: "Josh",   budget: "medium", distance: 6, cats: new Set(["Arts & Culture"]) },
];

let NEXT_USER_NUM = USERS.length + 1;
const SUGGESTED_NAMES = ["Maya","Ravi","Zoe","Theo","Liam","Priya","Noah","Iris","Owen","Nia"];

function makeNewUser() {
  const idx = NEXT_USER_NUM++;
  const name = SUGGESTED_NAMES[(idx - 1) % SUGGESTED_NAMES.length];
  return { id: `user_${idx}`, name, budget: "medium", distance: 5, cats: new Set(["Food & Drink"]) };
}

function renderUsers() {
  const root = document.getElementById("users");
  root.innerHTML = "";
  const onlyOne = USERS.length <= 1;

  USERS.forEach((u, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <input class="name-input" type="text" value="${u.name}" placeholder="Friend's name"
               data-idx="${i}" data-field="name" maxlength="24" />
        <span class="user-id-tag">${u.id}</span>
        <button class="remove-btn" title="Remove this friend"
                data-idx="${i}" ${onlyOne ? "disabled" : ""}>×</button>
      </div>
      <label>Describe the vibe (optional, LLM fills in below)</label>
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <input class="vibe-input" type="text" placeholder="e.g. chill cocktail night, no clubs"
               data-idx="${i}" style="flex:1;" />
        <button class="vibe-btn" data-idx="${i}" type="button">Parse</button>
      </div>
      <div class="vibe-status meta" id="vibe-status-${i}"></div>
      <label>Budget</label>
      <select data-idx="${i}" data-field="budget">
        <option value="low" ${u.budget==='low'?'selected':''}>low</option>
        <option value="medium" ${u.budget==='medium'?'selected':''}>medium</option>
        <option value="high" ${u.budget==='high'?'selected':''}>high</option>
      </select>
      <label>Max distance (km): <span id="d${i}">${u.distance}</span></label>
      <input type="range" min="1" max="15" value="${u.distance}" data-idx="${i}" data-field="distance" style="width:100%" />
      <label>Categories</label>
      <div class="cats" data-idx="${i}">
        ${CATEGORIES.map(c => `<span class="chip ${u.cats.has(c)?'on':''}" data-cat="${c}">${c}</span>`).join("")}
      </div>
    `;
    root.appendChild(card);
  });

  // "+ Add friend" card always appears at the end (cap at 10 to keep UI sane)
  if (USERS.length < 10) {
    const addCard = document.createElement("div");
    addCard.className = "add-card";
    addCard.id = "add-friend";
    addCard.innerHTML = `<span>+</span> Add friend`;
    root.appendChild(addCard);
  }

  // Wire up the add-friend card
  const addCard = document.getElementById("add-friend");
  if (addCard) {
    addCard.addEventListener("click", () => {
      USERS.push(makeNewUser());
      renderUsers();
    });
  }

  // Wire up per-card events
  root.querySelectorAll(".name-input").forEach(el => {
    el.addEventListener("input", e => {
      USERS[+e.target.dataset.idx].name = e.target.value.trim() || "Friend";
    });
  });
  root.querySelectorAll(".remove-btn").forEach(el => {
    el.addEventListener("click", e => {
      const idx = +e.currentTarget.dataset.idx;
      USERS.splice(idx, 1);
      renderUsers();
    });
  });
  root.querySelectorAll("select[data-field=budget]").forEach(el => {
    el.addEventListener("change", e => {
      USERS[+e.target.dataset.idx].budget = e.target.value;
    });
  });
  root.querySelectorAll("input[data-field=distance]").forEach(el => {
    el.addEventListener("input", e => {
      const i = +e.target.dataset.idx;
      USERS[i].distance = +e.target.value;
      document.getElementById("d" + i).textContent = e.target.value;
    });
  });
  root.querySelectorAll(".cats").forEach(container => {
    container.addEventListener("click", e => {
      if (!e.target.classList.contains("chip")) return;
      const i = +container.dataset.idx;
      const cat = e.target.dataset.cat;
      if (USERS[i].cats.has(cat)) {
        USERS[i].cats.delete(cat);
        e.target.classList.remove("on");
      } else {
        USERS[i].cats.add(cat);
        e.target.classList.add("on");
      }
    });
  });
  root.querySelectorAll(".vibe-btn").forEach(btn => {
    btn.addEventListener("click", e => parseVibe(+e.currentTarget.dataset.idx));
  });
}

// Derive /parse URL from the /recommend URL the user entered.
function parseUrlFromApi() {
  const apiUrl = document.getElementById("apiUrl").value.trim();
  return apiUrl.replace(/\/recommend\/?$/, "/parse");
}

async function parseVibe(idx) {
  const input = document.querySelector(`.vibe-input[data-idx="${idx}"]`);
  const statusEl = document.getElementById(`vibe-status-${idx}`);
  const text = (input?.value || "").trim();
  if (!text) {
    statusEl.textContent = "Type a vibe first.";
    return;
  }
  statusEl.textContent = "Parsing...";
  try {
    const resp = await fetch(parseUrlFromApi(), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ free_text: text }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.statusText);

    USERS[idx].budget   = data.budget;
    USERS[idx].distance = Math.round(data.max_distance_km);
    USERS[idx].cats     = new Set(data.categories || []);
    renderUsers();
    // Restore the typed text so the user can iterate.
    const restored = document.querySelector(`.vibe-input[data-idx="${idx}"]`);
    if (restored) restored.value = text;
    const restoredStatus = document.getElementById(`vibe-status-${idx}`);
    if (restoredStatus) {
      restoredStatus.textContent = data.used_llm
        ? `Parsed by ${data.llm_model} (${data.llm_latency_ms}ms)`
        : "Used defaults (no OPENAI_API_KEY).";
    }
  } catch (err) {
    statusEl.textContent = `Parse failed: ${err.message}`;
  }
}

// Holds the latest recommendation context so feedback POSTs can include rec_id
let LAST_REC = { rec_id: null, apiUrl: null };

async function recommend() {
  const apiUrl = document.getElementById("apiUrl").value.trim();
  const topK = +document.getElementById("topK").value || 5;
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  output.innerHTML = "";
  status.textContent = "Calling API...";

  const body = {
    top_k: topK,
    users: USERS.map(u => ({
      user_id: u.id,
      budget: u.budget,
      max_distance_km: u.distance,
      categories: Array.from(u.cats),
    })),
  };

  try {
    const resp = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const text = await resp.text();
    if (!resp.ok) {
      status.innerHTML = `<div class="error">API ${resp.status}: ${text}</div>`;
      return;
    }
    const data = JSON.parse(text);
    LAST_REC = { rec_id: data.rec_id, apiUrl };
    renderResult(data);
    const recPart = data.rec_id != null ? ` (rec #${data.rec_id})` : "";
    status.textContent = `Scored ${data.venues_scored} venues. Showing top ${data.recommendations.length}${recPart}.`;
  } catch (err) {
    status.innerHTML = `<div class="error">Network error: ${err.message}. Is FastAPI running on ${apiUrl}?</div>`;
  }
}

function renderResult(data) {
  const output = document.getElementById("output");
  const recId = data.rec_id;
  const merged = `
    <div class="card" style="margin-top:16px">
      <h3>Group agreement</h3>
      <div><span class="pill">budget</span>${data.merged_budget}
           <span class="pill" style="margin-left:12px">max distance</span>${data.merged_max_distance_km} km
           <span class="pill" style="margin-left:12px">size</span>${data.group_size}</div>
      <div class="meta">categories: ${data.merged_categories.map(c=>`<span class="pill">${c}</span>`).join(" ")}</div>
      ${recId != null ? `<div class="rec-id">rec_id: ${recId} · model: ${data.model_version || 'rules_v1'}</div>` : ""}
    </div>
  `;
  const banner = data.used_llm
    ? `<div class="rank-mode llm">LLM-ranked · ${data.llm_model ?? "?"} · ${data.llm_latency_ms ?? "?"}ms</div>`
    : `<div class="rank-mode v0">Heuristic ranking (v0)</div>`;
  const venues = `
    ${banner}
    <div class="venues">
      ${data.recommendations.map(v => `
        <div class="venue">
          <h4>${v.name}</h4>
          <div>
            <span class="pill">${v.category}</span>
            <span class="pill">${v.price_level}</span>
            <span class="pill">${v.rating?.toFixed?.(1) ?? v.rating} ⭐</span>
            <span class="pill">${v.distance_km?.toFixed?.(2) ?? v.distance_km} km</span>
            <span class="score">score ${v.score}</span>
          </div>
          <div class="reason">${v.reason}</div>
          ${v.google_maps_uri ? `<div class="meta"><a href="${v.google_maps_uri}" target="_blank">Open in Google Maps</a></div>` : ""}
          <div class="feedback" data-venue="${encodeURIComponent(v.name)}" data-score="${v.score}">
            <button class="fb-btn yay"  data-signal="yay">Yay 🎉</button>
            <button class="fb-btn nahh" data-signal="nahh">Nahh 👎</button>
            <span class="fb-status"></span>
          </div>
        </div>
      `).join("")}
    </div>
  `;
  output.innerHTML = merged + venues;
}

async function sendFeedback(btn) {
  const wrap   = btn.closest(".feedback");
  const venue  = decodeURIComponent(wrap.dataset.venue);
  const score  = parseFloat(wrap.dataset.score);
  const signal = btn.dataset.signal;          // 'yay' or 'nahh'
  const status = wrap.querySelector(".fb-status");
  const apiUrl = (LAST_REC.apiUrl || document.getElementById("apiUrl").value.trim())
                   .replace(/\/recommend$/, "/feedback");

  // Disable both buttons so we don't double-send
  wrap.querySelectorAll(".fb-btn").forEach(b => {
    b.disabled = true;
    b.classList.add("sent");
  });
  status.textContent = "saving...";

  // For the demo, attribute group feedback to the first user (Sai) and keep the
  // full group + score snapshot in context for the training pipeline.
  const body = {
    user_id:    USERS[0].id,
    rec_id:     LAST_REC.rec_id,
    venue_name: venue,
    signal:     signal,
    request_context: {
      score_at_recommendation: score,
      group_user_ids: USERS.map(u => u.id),
      source: "demo.html",
    },
  };

  try {
    const resp = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok) {
      status.textContent = `error: ${data.detail || resp.status}`;
      return;
    }
    status.textContent = data.stored
      ? `saved · feedback #${data.feedback_id}`
      : "logged (DB not configured)";
  } catch (err) {
    status.textContent = `network error: ${err.message}`;
  }
}

document.getElementById("go").addEventListener("click", recommend);

// Event delegation for Yay/Nahh buttons (cards are re-rendered each request)
document.getElementById("output").addEventListener("click", (e) => {
  if (e.target.classList.contains("fb-btn") && !e.target.disabled) {
    sendFeedback(e.target);
  }
});

renderUsers();
</script>
